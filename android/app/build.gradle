apply plugin: 'com.android.application'

// Values are supplied to this process only; never commit passwords or key files.
def signingValues = ['HOWHOUSE_KEYSTORE_PATH','HOWHOUSE_KEYSTORE_PASSWORD','HOWHOUSE_KEY_ALIAS','HOWHOUSE_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
def signingReady = signingValues.values().every { it != null && !it.isEmpty() }
def appRelease = new groovy.json.JsonSlurper().parse(rootProject.file('../src/catalog/app-release.json'))
if (!(appRelease.versionCode instanceof Number) || appRelease.versionCode < 1 || appRelease.versionCode > 2100000000 || appRelease.versionCode != appRelease.versionCode.intValue()) throw new GradleException('앱 출시 설정의 versionCode가 올바르지 않습니다.')

android {
    namespace = "com.howhouse.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId appRelease.applicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appRelease.versionCode.intValue()
        versionName appRelease.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingReady) {
            upload {
                storeFile file(signingValues.HOWHOUSE_KEYSTORE_PATH)
                storePassword signingValues.HOWHOUSE_KEYSTORE_PASSWORD
                keyAlias signingValues.HOWHOUSE_KEY_ALIAS
                keyPassword signingValues.HOWHOUSE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        youtubeQa {
            initWith debug
            versionNameSuffix '-youtube-check'
            matchingFallbacks = ['debug']
            if (signingReady) signingConfig signingConfigs.upload
        }
        release {
            if (signingReady) signingConfig signingConfigs.upload
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Same package/key update for the owner's device; never a Play-submission build.
tasks.matching { it.name == 'preYoutubeQaBuild' }.configureEach {
    doFirst {
        if (!signingReady) throw new GradleException('YouTube 확인용 APK도 기존 업로드 키로 서명해야 합니다.')
        def info = new groovy.json.JsonSlurper().parse(file('src/main/assets/public/howhouse-build.json'))
        if (info.variant != 'catalog' || info.mode != 'catalog-preview' || info.releaseApproved != false || info.youtubePreview != true || info.youtubeApiConfigured != true) {
            throw new GradleException('YouTube 확인용 웹 빌드가 아닙니다. Play 제출에 사용하지 마세요.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('catalogReleaseInfo') {
    group = 'verification'
    description = 'Print public release identity only; never reads or prints signing secrets.'
    doLast {
        println groovy.json.JsonOutput.toJson([applicationId: android.defaultConfig.applicationId, versionCode: android.defaultConfig.versionCode, versionName: android.defaultConfig.versionName])
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// A signed release must use an approved web release, not the last trial assets.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!signingReady) throw new GradleException('출시 서명 환경변수 4개가 필요합니다. 비밀번호를 로그나 Git에 기록하지 마세요.')
        def infoFile = file('src/main/assets/public/howhouse-build.json')
        if (!infoFile.exists()) {
            throw new GradleException('출시 웹 파일 확인표가 없습니다. 승인된 release 웹 빌드 후 Capacitor 동기화가 필요합니다.')
        }
        def info = new groovy.json.JsonSlurper().parse(infoFile)
        def policyFile = rootProject.file('../src/catalog/policy.ts')
        def policyHash = java.security.MessageDigest.getInstance('SHA-256').digest(policyFile.bytes).encodeHex().toString()
        def approval = new groovy.json.JsonSlurper().parse(rootProject.file('../src/catalog/release-approval.json'))
        def youtubeApproval = new groovy.json.JsonSlurper().parse(rootProject.file('../src/youtube/release-approval.json'))
        if (info.youtubePreview != true || info.youtubeApiConfigured != true || info.youtubeReleaseVerified != true || !youtubeApproval.privacyNoticePublished || !youtubeApproval.providerPolicyReviewed || !youtubeApproval.androidPreviewVerified || !youtubeApproval.playSigningRestrictionVerified) {
            throw new GradleException('YouTube 미리보기의 공개 개인정보 안내 및 Android/Play 서명 검증이 필요합니다.')
        }
        if (info.schema != 2 || info.variant != 'catalog' || !(info.mode in ['release', 'production']) || info.aiEnabled != false || info.serverStorage != false || info.releaseApproved != true || info.policyStatus != 'published' || info.policySha256 != policyHash || info.policyVersion != approval.policyVersion || !approval.publicPolicyVerified || !approval.androidVerified || !approval.externalContentRightsVerified || !approval.legacyDataTransitionReviewed) {
            throw new GradleException('현재 웹 파일은 승인된 최신 출시 빌드가 아닙니다. release 웹 빌드와 Capacitor 동기화를 다시 확인하세요.')
        }
    }
}
